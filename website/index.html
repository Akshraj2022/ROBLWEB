<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relate or Be Late by Aksh R.</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cinzel:wght@400;600&display=swap');

        :root {
            --parchment: #F4F1E1; 
            --ink: #2C1E16; /* Deep sepia/brown ink */
            --accent: #8B5A2B;
            --button-bg: rgba(139, 90, 43, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--parchment);
            background-image: 
                radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.05) 100%),
                url('data:image/svg+xml,%3Csvg width="200" height="200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="200" height="200" filter="url(%23noise)" opacity="0.05"/%3E%3C/svg%3E');
            color: var(--ink);
            font-family: 'Playfair Display', serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .main-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            gap: 100px;
            z-index: 10;
            position: relative;
            padding: 40px;
        }

        /* 3D Book Scene */
        .scene {
            width: 400px;
            height: 600px;
            perspective: 1200px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .book-container {
            width: 0;
            height: 0;
            position: relative;
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite, rotate3d 20s linear infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes rotate3d {
            0% { transform: rotateY(0deg) rotateX(5deg); }
            100% { transform: rotateY(360deg) rotateX(5deg); }
        }

        .book-face {
            position: absolute;
            left: 50%;
            top: 50%;
            background-size: 100% 100%;
            background-position: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
        }

        /* 
           Book Dimensions: 300x450, Thickness: 40px 
        */
        .front {
            width: 300px; height: 450px;
            margin: -225px 0 0 -150px;
            transform: translateZ(20px);
            background-image: url('front_cover.png');
            border-radius: 0 3px 3px 0;
        }
        
        .back {
            width: 300px; height: 450px;
            margin: -225px 0 0 -150px;
            transform: rotateY(180deg) translateZ(20px);
            background-image: url('back_cover.png');
            border-radius: 3px 0 0 3px;
        }

        .spine {
            width: 40px; height: 450px;
            margin: -225px 0 0 -20px;
            transform: rotateY(-90deg) translateZ(150px);
            background-color: #D2C4AE;
            background-image: url('data:image/svg+xml,%3Csvg width="40" height="450" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="40" height="450" filter="url(%23noise)" opacity="0.1"/%3E%3C/svg%3E');
        }

        .right {
            width: 40px; height: 450px;
            margin: -225px 0 0 -20px;
            transform: rotateY(90deg) translateZ(150px);
            background: #fdfbf7;
            background-image: repeating-linear-gradient(to bottom, #fdfbf7 0px, #fdfbf7 2px, #e8e4d9 3px);
        }

        .top {
            width: 300px; height: 40px;
            margin: -20px 0 0 -150px;
            transform: rotateX(90deg) translateZ(225px);
            background: #fdfbf7;
            background-image: repeating-linear-gradient(to right, #fdfbf7 0px, #fdfbf7 2px, #e8e4d9 3px);
        }

        .bottom {
            width: 300px; height: 40px;
            margin: -20px 0 0 -150px;
            transform: rotateX(-90deg) translateZ(225px);
            background: #fdfbf7;
            background-image: repeating-linear-gradient(to right, #fdfbf7 0px, #fdfbf7 2px, #e8e4d9 3px);
        }

        .page-shadow {
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        /* Content Right */
        .content {
            flex: 1;
            max-width: 550px;
            animation: fadeIn 2s ease-out forwards;
            opacity: 0;
            transform: translateX(30px);
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateX(0); }
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 4.5rem;
            line-height: 1.1;
            margin-bottom: 0.5rem;
            color: var(--ink);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .author {
            font-size: 1.8rem;
            font-style: italic;
            margin-bottom: 2.5rem;
            color: var(--accent);
            opacity: 0.9;
        }

        .tagline {
            font-size: 1.4rem;
            line-height: 1.7;
            margin-bottom: 3.5rem;
            position: relative;
            padding-left: 20px;
            border-left: 3px solid var(--accent);
            color: #3e2723;
        }

        /* Pricing & Buttons */
        .purchase-options {
            display: flex;
            gap: 2.5rem;
        }

        .btn-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .btn {
            background-color: transparent;
            border: 1px solid var(--accent);
            color: var(--ink);
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-family: 'Cinzel', serif;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--button-bg);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
            z-index: -1;
        }

        .btn:hover::before {
            transform: scaleX(1);
        }

        .btn:hover {
            box-shadow: 0 5px 15px rgba(139, 90, 43, 0.2);
            border-color: var(--ink);
        }

        .price {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--accent);
            font-family: 'Playfair Display', serif;
        }
        
        .format {
            font-size: 0.85rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-family: sans-serif;
            opacity: 0.8;
        }
        
        .price-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                padding: 60px 20px;
                text-align: center;
                gap: 50px;
            }
            .content {
                transform: translateY(30px);
                animation: fadeInMobile 2s ease-out forwards;
            }
            @keyframes fadeInMobile {
                to { opacity: 1; transform: translateY(0); }
            }
            .tagline {
                border-left: none;
                padding-left: 0;
            }
            .purchase-options {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>

    <div class="main-container">
        
        <!-- Book on the Left -->
        <div class="scene">
            <div class="book-container" id="bookContainer">
                <div class="book-face front"></div>
                <div class="book-face back"></div>
                <div class="book-face spine"></div>
                <div class="book-face right page-shadow"></div>
                <div class="book-face top page-shadow"></div>
                <div class="book-face bottom page-shadow"></div>
            </div>
        </div>

        <!-- Text on the Right -->
        <div class="content">
            <h1>Relate<br>or be late</h1>
            <div class="author">by Aksh R.</div>
            <p class="tagline">The internet rides us like horses, steering our minds where it wills. Take back the reins. Shape your thoughts. Ride your own hills.</p>
            
            <div class="purchase-options">
                <div class="btn-wrapper">
                    <div class="price-row">
                        <span class="price">$0.99</span>
                        <span class="format">eBook</span>
                    </div>
                    <a href="#" id="ebookBtn" class="btn">Purchase</a>
                </div>
                <div class="btn-wrapper">
                    <div class="price-row">
                        <span class="price">$7.99</span>
                        <span class="format">Paperback</span>
                    </div>
                    <a href="#" id="paperbackBtn" class="btn">Purchase</a>
                </div>
            </div>
        </div>

    </div>

    <script>
        const bookContainer = document.getElementById('bookContainer');
        
        let mouseX = 0;
        let mouseY = 0;
        
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX) * 0.05;
            mouseY = (event.clientY - windowHalfY) * 0.05;
        });

        bookContainer.parentElement.addEventListener('mouseenter', () => {
            bookContainer.style.animation = 'float 6s ease-in-out infinite'; 
        });

        bookContainer.parentElement.addEventListener('mouseleave', () => {
            bookContainer.style.animation = 'float 6s ease-in-out infinite, rotate3d 20s linear infinite';
            bookContainer.style.transform = ''; 
        });

        function animateBook() {
            if (bookContainer.parentElement.matches(':hover')) {
                bookContainer.style.transform = `rotateX(${-mouseY}deg) rotateY(${mouseX}deg)`;
            }
            requestAnimationFrame(animateBook);
        }
        animateBook();

        // Canvas Particles (Dust/Vintage feel)
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.speedY = Math.random() * 0.4 - 0.2;
                this.opacity = Math.random() * 0.4 + 0.1;
                this.baseOpacity = this.opacity;
                this.pulseSpeed = Math.random() * 0.02 + 0.01;
                this.angle = Math.random() * Math.PI * 2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.angle += this.pulseSpeed;
                this.opacity = this.baseOpacity + Math.sin(this.angle) * 0.1;
                
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }
            draw() {
                ctx.fillStyle = `rgba(139, 90, 43, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 100; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // ── Amazon Country Detection ──
        const ASIN = 'B0HM3N5WSJ';
        const amazonDomains = {
            US: 'amazon.com',
            GB: 'amazon.co.uk',
            IN: 'amazon.in',
            CA: 'amazon.ca',
            DE: 'amazon.de',
            FR: 'amazon.fr',
            IT: 'amazon.it',
            ES: 'amazon.es',
            JP: 'amazon.co.jp',
            AU: 'amazon.com.au',
            BR: 'amazon.com.br',
            MX: 'amazon.com.mx',
            NL: 'amazon.nl',
            SE: 'amazon.se',
            PL: 'amazon.pl',
            TR: 'amazon.com.tr',
            AE: 'amazon.ae',
            SA: 'amazon.sa',
            SG: 'amazon.sg',
        };

        function setAmazonLinks(countryCode) {
            const domain = amazonDomains[countryCode] || amazonDomains['US'];
            const url = `https://www.${domain}/dp/${ASIN}`;
            const ebookBtn = document.getElementById('ebookBtn');
            const paperbackBtn = document.getElementById('paperbackBtn');
            if (ebookBtn) { ebookBtn.href = url; ebookBtn.target = '_blank'; }
            if (paperbackBtn) { paperbackBtn.href = url; paperbackBtn.target = '_blank'; }
        }

        fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                const code = (data && data.country_code) ? data.country_code.toUpperCase() : 'US';
                setAmazonLinks(code);
            })
            .catch(() => setAmazonLinks('US')); // fallback to US
    </script>
</body>
</html>
